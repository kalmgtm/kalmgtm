<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kalm GTM — Page Not Found</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=DM+Mono:wght@300;400;500&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0c0c0b; --border: #242422; --muted: #4a4a46; --mid: #8a8a84;
      --white: #f0ede6; --accent: #c9a96e;
      --serif: 'Cormorant Garamond', Georgia, serif;
      --mono: 'DM Mono', 'Courier New', monospace;
      --sans: 'Instrument Sans', sans-serif;
    }
    body {
      background: var(--bg); color: var(--mid); font-family: var(--sans);
      font-size: 15px; line-height: 1.6; display: flex; align-items: center;
      justify-content: center; min-height: 100vh; text-align: center;
      -webkit-font-smoothing: antialiased;
    }
    .inner { max-width: 400px; padding: 48px 24px; }
    h1 {
      font-family: var(--serif); font-size: 64px; font-weight: 300;
      color: var(--white); margin-bottom: 16px;
    }
    p { margin-bottom: 32px; }
    a {
      font-family: var(--mono); font-size: 11px; letter-spacing: 0.12em;
      text-transform: uppercase; color: var(--bg); background: var(--accent);
      padding: 12px 28px; text-decoration: none; display: inline-block;
      transition: background 0.2s;
    }
    a:hover { background: var(--white); }
  </style>
</head>
<body>
  <div class="inner">
    <h1>404</h1>
    <p>Page not found. Nothing here.</p>
    <a href="/">Back to Kalm GTM</a>
  </div>
</body>
</html>
